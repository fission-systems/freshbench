[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freshbench"
version = "2.0.0.dev0"
description = "DecBench-compatible decompiler evaluation with improvement targets"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
freshbench = "freshbench.cli:main"

[tool.setuptools]
packages = ["freshbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
