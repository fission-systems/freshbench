[package]
name = "freshbench"
version = "2.0.0-dev"
description = "FreshBench: a decompiler benchmark with its own ground truth, metrics and improvement targets"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "freshbench"
path = "src/main.rs"

[features]
# Opt-in error reporting to Sentry. Off by default: without this feature no
# Sentry code is compiled, and with it the CLI still sends nothing unless
# FRESHBENCH_SENTRY=1 and SENTRY_DSN are set. Panics only, no message text
# (see src/telemetry.rs).
sentry = ["dep:sentry"]

[dependencies]
anyhow = "1"
sentry = { version = "0.49.6", default-features = false, features = ["panic", "backtrace", "contexts", "transport"], optional = true }
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
libc = "0.2"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder"] }
gimli = { version = "0.33", default-features = false, features = ["read", "std"] }
object = { version = "0.39", default-features = false, features = ["read", "std", "compression"] }
rayon = "1.12"
rust-joern = { path = "../rust-joern" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tree-sitter = "0.26"
tree-sitter-c = "0.24"

[dev-dependencies]
object = { version = "0.39", default-features = false, features = ["read", "std", "write"] }

[build-dependencies]
sha2 = "0.10"

