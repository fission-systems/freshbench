[package]
name = "freshbench"
version = "2.0.0-dev"
description = "FreshBench: a decompiler benchmark with its own ground truth, metrics and improvement targets"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "freshbench"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
libc = "0.2"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder"] }
gimli = { version = "0.33", default-features = false, features = ["read", "std"] }
object = { version = "0.39", default-features = false, features = ["read", "std", "compression"] }
rayon = "1.12"
rust-joern = { path = "../rust-joern" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tree-sitter = "0.26"
tree-sitter-c = "0.24"

[build-dependencies]
sha2 = "0.10"

