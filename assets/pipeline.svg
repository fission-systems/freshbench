<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="t d">
  <title id="t">FreshBench pipeline</title>
  <desc id="d">Stripped corpus binaries go to each decompiler adapter. Its output is scored against the source ground truth and the unstripped binary, then aggregated into rows, reports and improvement targets.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6470"/>
    </marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="32" y="40" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2933">Static evaluation pipeline</text>
  <text x="32" y="62" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6470">No corpus binary is executed. Every row is kept, including failures.</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="32" y="110" width="150" height="90" rx="8" fill="#eef4fb" stroke="#2f6fb0" stroke-width="1.5"/>
    <text x="107" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Corpus</text>
    <text x="107" y="162" text-anchor="middle" font-size="12" fill="#3e4c59">stripped binaries</text>
    <text x="107" y="178" text-anchor="middle" font-size="12" fill="#3e4c59">+ truth (grading only)</text>

    <rect x="222" y="110" width="150" height="90" rx="8" fill="#f4f6f8" stroke="#5b6470" stroke-width="1.5"/>
    <text x="297" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Adapter</text>
    <text x="297" y="162" text-anchor="middle" font-size="12" fill="#3e4c59">one per decompiler</text>
    <text x="297" y="178" text-anchor="middle" font-size="12" fill="#3e4c59">output as printed</text>

    <rect x="412" y="110" width="150" height="90" rx="8" fill="#f4f6f8" stroke="#5b6470" stroke-width="1.5"/>
    <text x="487" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Scorers</text>
    <text x="487" y="162" text-anchor="middle" font-size="12" fill="#3e4c59">GED · Joern GED</text>
    <text x="487" y="178" text-anchor="middle" font-size="12" fill="#3e4c59">types · recompile · bounds</text>

    <rect x="602" y="110" width="150" height="90" rx="8" fill="#f4f6f8" stroke="#5b6470" stroke-width="1.5"/>
    <text x="677" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Rows</text>
    <text x="677" y="162" text-anchor="middle" font-size="12" fill="#3e4c59">one per function</text>
    <text x="677" y="178" text-anchor="middle" font-size="12" fill="#3e4c59">per tool, per build</text>

    <rect x="792" y="110" width="136" height="90" rx="8" fill="#eef8f1" stroke="#2e7d4f" stroke-width="1.5"/>
    <text x="860" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Report</text>
    <text x="860" y="162" text-anchor="middle" font-size="12" fill="#3e4c59">report · gaps</text>
    <text x="860" y="178" text-anchor="middle" font-size="12" fill="#3e4c59">speed · manifest</text>
  </g>

  <g stroke="#5b6470" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="184" y1="155" x2="220" y2="155"/>
    <line x1="374" y1="155" x2="410" y2="155"/>
    <line x1="564" y1="155" x2="600" y2="155"/>
    <line x1="754" y1="155" x2="790" y2="155"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3e4c59">
    <text x="32" y="250">The corpus manifest and truth define the denominator. A missing,</text>
    <text x="32" y="268">crashed or unparsable output is a row that scores as not perfect.</text>
    <text x="32" y="292" fill="#2e7d4f">Publication requires every registered, maintained, non-LLM tool to have a row for every target.</text>
  </g>
</svg>
