name: sync-managed-labels

# Creates labels from .github/labels.json that the repository is missing.
# Additive only: existing labels are never deleted, renamed or recolored
# (ci/sync_github_labels.py). apply=false previews.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Create missing labels (false previews only)
        type: boolean
        default: false

permissions: {}

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Preview or create missing labels
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ inputs.apply }}
          REPOSITORY: ${{ github.repository }}
        run: |
          args=(--repo "$REPOSITORY")
          if [[ "$APPLY" == "true" ]]; then args+=(--apply); fi
          python3 ci/sync_github_labels.py "${args[@]}"
