name: build-image-cross
# Cross build image: the native x86-64 image (pinned by digest) + cross GCC 16.2.0 and
# Clang 23.1.6 for i686, aarch64, armv7. Pushes to the org's GHCR and records
# the digest, toolchain versions and the foreign package set as an artifact.
on:
  workflow_dispatch:
    inputs:
      tag: { description: "image tag", required: true, default: "v2-gcc16.2.0-llvm23.1.6-r1" }
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3  # exposes the cache API to buildx (type=gha)
      - name: build
        run: |
          img="ghcr.io/fission-systems/freshbench-build-cross:${{ inputs.tag }}"
          rc=0; docker buildx build --progress=plain --load \
            --cache-from type=gha,scope=cross --cache-to type=gha,mode=max,scope=cross \
            -f build/Dockerfile.cross -t "$img" build/ > build.log 2>&1 || rc=$?
          grep -E 'elfclass|gcc version|clang version|^[0-9]+$' build.log | tail -40 || true
          if [ "$rc" != 0 ]; then tail -150 build.log; exit "$rc"; fi
          docker push "$img"
          docker inspect --format '{{index .RepoDigests 0}}' "$img" | tee digest.txt
          docker run --rm "$img" cat /etc/freshbench/toolchains.txt | tee toolchains.txt
          docker run --rm "$img" cat /etc/freshbench/foreign-packages.txt > foreign-packages.txt
          docker run --rm "$img" cat /etc/freshbench/dpkg-versions.txt > dpkg-versions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: image-cross, path: "*.txt\nbuild.log" }
