name: build-image-cross
# Cross build image: the native x86-64 image (pinned by digest) + cross GCC 16.2.0 and
# Clang 23.1.6 for i686, aarch64, armv7. Pushes to the org's GHCR and records
# the digest, toolchain versions and the foreign package set as an artifact.
on:
  workflow_dispatch:
    inputs:
      tag: { description: "image tag", required: true, default: "v2-gcc16.2.0-llvm23.1.6-r1" }
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # exposes the cache API to buildx (type=gha)
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0
      - name: build
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          # Docker's tag grammar; anything else fails `docker build -t` anyway
          if ! [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then echo "invalid image tag: $IMAGE_TAG" >&2; exit 1; fi
          img="ghcr.io/fission-systems/freshbench-build-cross:$IMAGE_TAG"
          rc=0; docker buildx build --progress=plain --load \
            --cache-from type=gha,scope=cross --cache-to type=gha,mode=max,scope=cross \
            -f build/Dockerfile.cross -t "$img" build/ > build.log 2>&1 || rc=$?
          grep -E 'elfclass|gcc version|clang version|^[0-9]+$' build.log | tail -40 || true
          if [ "$rc" != 0 ]; then tail -150 build.log; exit "$rc"; fi
          docker push "$img"
          docker inspect --format '{{index .RepoDigests 0}}' "$img" | tee digest.txt
          docker run --rm "$img" cat /etc/freshbench/toolchains.txt | tee toolchains.txt
          docker run --rm "$img" cat /etc/freshbench/foreign-packages.txt > foreign-packages.txt
          docker run --rm "$img" cat /etc/freshbench/dpkg-versions.txt > dpkg-versions.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: image-cross, path: "*.txt\nbuild.log" }
