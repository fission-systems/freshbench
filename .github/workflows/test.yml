name: test
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q -e '.[test]'
      - run: python -m pytest -q
      - name: manifests verify against their own summary
        run: |
          for m in corpus/*/manifest.jsonl; do
            [ -e "$m" ] || continue
            python -m freshbench manifest summary "$m" > /dev/null
          done
