name: test
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: the ELF end-to-end test must take the GCC path
        run: cargo test --locked elf_end_to_end -- --nocapture 2>&1 | tee e2e.log; grep -q "cc is gcc = true" e2e.log
