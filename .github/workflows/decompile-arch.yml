name: decompile-arch
on:
  workflow_dispatch:
    inputs:
      qualify_run: { description: "run id of qualify-arch holding qual-<slug>-<arch> artifacts and the rust-joern wheel", required: true }
      arch: { description: "x86_64 | i686 | aarch64 | armv7", required: true }
      projects: { description: "JSON list of slugs (owner__repo)", required: true }
      tools: { description: "JSON list", default: '["ghidra","angr","kuna","fission","borer"]' }
      compilers: { description: "JSON list", default: '["gcc","clang"]' }
      configs: { description: "space-separated", default: "O0 O1 O2 O3 Os O2-noinline" }
      binary_memory_gib: { description: "DECBENCH_BINARY_MEMORY_LIMIT_GIB", default: "12" }
      runs: { description: 'JSON {slug: qualify_run_id}; overrides qualify_run per project', default: "" }
      fission_ref: { description: "git ref of Fission to build instead of the pinned FISSION_SHA", default: "" }
      fission_repo: { description: "Fission repository URL (with fission_ref)", default: "" }
permissions: { contents: read, actions: read, packages: read }
jobs:
  fission-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs: { sha: "${{ steps.ref.outputs.sha }}", repo: "${{ steps.ref.outputs.repo }}" }
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: |
          source ci/pins.env
          repo="${{ inputs.fission_repo }}"; [ -n "$repo" ] || repo="$FISSION_REPO"
          ref="${{ inputs.fission_ref }}"
          if [ -n "$ref" ]; then sha=$(git ls-remote "$repo" "$ref" | head -1 | cut -f1); [ -n "$sha" ] || sha="$ref"; else sha="$FISSION_SHA"; fi
          echo "FISSION_SHA=$sha" >> "$GITHUB_ENV"; echo "FISSION_REPO=$repo" >> "$GITHUB_ENV"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "repo=$repo" >> "$GITHUB_OUTPUT"; echo "fission $repo @ $sha"
      - uses: actions/cache@v4
        id: c
        with: { path: fission-bin, key: "fission-cli-${{ env.FISSION_SHA }}" }
      - if: steps.c.outputs.cache-hit != 'true'
        run: |
          git init -q fsrc && git -C fsrc fetch -q --depth 1 "$FISSION_REPO" "$FISSION_SHA" && git -C fsrc checkout -q FETCH_HEAD
          (cd fsrc && cargo build -p fission-cli --release --locked)
          mkdir -p fission-bin && cp fsrc/target/release/fission_cli fission-bin/
      - uses: actions/upload-artifact@v4
        with: { name: fission-cli, path: fission-bin }
  run:
    needs: fission-build
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
        tool: ${{ fromJSON(inputs.tools) }}
        compiler: ${{ fromJSON(inputs.compilers) }}
    env:
      FB_ARCH: ${{ inputs.arch }}
      DECBENCH_BINARY_MEMORY_LIMIT_GIB: ${{ inputs.binary_memory_gib }}
      DECBENCH_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ci/pins.env }
      - uses: actions/setup-java@v4
        if: matrix.tool == 'ghidra'
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/download-artifact@v4
        with: { name: rust-joern-wheel, path: "${{ runner.temp }}/wheels", run-id: "${{ inputs.qualify_run }}", github-token: "${{ github.token }}" }
      - uses: actions/download-artifact@v4
        with: { name: "qual-${{ matrix.project }}-${{ inputs.arch }}", path: "${{ runner.temp }}/qual", run-id: "${{ inputs.runs != '' && fromJSON(inputs.runs)[matrix.project] || inputs.qualify_run }}", github-token: "${{ github.token }}" }
      - if: matrix.tool == 'fission'
        uses: actions/download-artifact@v4
        with: { name: fission-cli, path: "${{ runner.temp }}/fission/target/release" }
      - if: matrix.tool == 'fission'
        env: { FISSION_SHA: "${{ needs.fission-build.outputs.sha }}", FISSION_REPO: "${{ needs.fission-build.outputs.repo }}" }
        run: |
          git init -q "$RUNNER_TEMP/fsrc"
          git -C "$RUNNER_TEMP/fsrc" fetch -q --depth 1 --filter=blob:none "$FISSION_REPO" "$FISSION_SHA"
          git -C "$RUNNER_TEMP/fsrc" checkout -q FETCH_HEAD -- utils
          echo "$FISSION_SHA" > "$RUNNER_TEMP/fission/SHA"
          mv "$RUNNER_TEMP/fsrc/utils" "$RUNNER_TEMP/fission/utils"
          chmod +x "$RUNNER_TEMP/fission/target/release/fission_cli"
      - run: ci/setup_scorer.sh
      - run: ci/setup_tool.sh ${{ matrix.tool }}
      - run: ci/setup_systemd_user.sh
      - name: score image (byte_match, x86-64 only)
        if: inputs.arch == 'x86_64'
        run: |
          source ci/pins.env
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull -q "$SCORE_IMAGE" && echo "SCORE_IMAGE=$SCORE_IMAGE" >> "$GITHUB_ENV"
      - name: decompile and score
        run: |
          mkdir -p "$RUNNER_TEMP/prep" && tar -xf "$RUNNER_TEMP/qual/prep.tar" -C "$RUNNER_TEMP/prep"
          for conf in ${{ inputs.configs }}; do
            key="${{ matrix.compiler }}-$conf"
            [ -f "$RUNNER_TEMP/prep/prep/$key/manifest.json" ] || { echo "no $key"; continue; }
            echo "::group::$key"
            /usr/bin/time -v python -I pipeline/run_tool.py "$DECBENCH_ROOT" "$RUNNER_TEMP/prep/prep/$key" \
              ${{ matrix.tool }} "$RUNNER_TEMP/res/$key/${{ matrix.tool }}" 2> "$RUNNER_TEMP/time-$key.txt" || echo "run_tool failed $?"
            tail -25 "$RUNNER_TEMP/time-$key.txt"; mkdir -p "$RUNNER_TEMP/res/$key/${{ matrix.tool }}"
            cp "$RUNNER_TEMP/time-$key.txt" "$RUNNER_TEMP/res/$key/${{ matrix.tool }}/time.txt"
            echo "::endgroup::"
          done
          find "$RUNNER_TEMP/res" -name '*.addrs.json' -delete; rm -rf "$RUNNER_TEMP"/res/*/*/decompiled
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "res-${{ matrix.project }}-${{ inputs.arch }}-${{ matrix.tool }}-${{ matrix.compiler }}", path: "${{ runner.temp }}/res", retention-days: 90 }
