name: evaluate
# Decompile prepared builds with one tool and score them with FreshBench's
# own metrics (Rust; no DecBench). Inputs come from a qualify-arch run.
on:
  workflow_dispatch:
    inputs:
      qualify_run: { description: "qualify-arch run id holding qual-<slug>-<arch> artifacts", required: true }
      projects: { description: "JSON list of slugs (owner__repo)", required: true }
      arch: { description: "x86_64 | i686 | aarch64 | armv7", required: true }
      tools: { description: "JSON list", default: '["fission","ghidra","angr","kuna","borer","unlace"]' }
      fission_ref: { description: "git ref of Fission (default: FISSION_SHA in ci/pins.env)", default: "" }
      max_parallel: { description: "concurrent jobs", default: "12" }
      track: { description: "decompile (given function starts) or boundaries (find the functions; as-built and no-unwind)", default: "decompile" }
      builds: { description: 'JSON list of arch-qualified builds, one job each (gcc-O0, armv7-clang-Os); [""] = every build in one job', default: '[""]' }
permissions: { contents: read, actions: read }
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs: { fission_sha: "${{ steps.ref.outputs.sha }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-release-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --locked -p freshbench
      - id: ref
        run: |
          source ci/pins.env
          ref='${{ inputs.fission_ref }}'
          if [ -n "$ref" ]; then sha=$(git ls-remote "$FISSION_REPO" "$ref" | head -1 | cut -f1); [ -n "$sha" ] || sha="$ref"; else sha="$FISSION_SHA"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "FISSION_SHA=$sha" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: fc
        with: { path: fission-bin, key: "fission-cli-${{ steps.ref.outputs.sha }}" }
      - if: contains(inputs.tools, 'fission') && steps.fc.outputs.cache-hit != 'true'
        run: |
          source ci/pins.env
          git init -q fsrc && git -C fsrc fetch -q --depth 1 "$FISSION_REPO" "$FISSION_SHA" && git -C fsrc checkout -q FETCH_HEAD
          (cd fsrc && cargo build -p fission-cli --release --locked)
          mkdir -p fission-bin && cp fsrc/target/release/fission_cli fission-bin/ && cp -r fsrc/utils fission-bin/utils
      - uses: actions/cache@v4
        id: uc
        if: contains(inputs.tools, 'unlace')
        with: { path: unlace-bin, key: "unlace-${{ hashFiles('ci/pins.env') }}" }
      - if: contains(inputs.tools, 'unlace') && steps.uc.outputs.cache-hit != 'true'
        run: |
          source ci/pins.env
          git init -q usrc && git -C usrc fetch -q --depth 1 "$UNLACE_REPO" "$UNLACE_SHA" && git -C usrc checkout -q FETCH_HEAD
          (cd usrc && cargo build --release --locked -p unlace-cli)
          mkdir -p unlace-bin && cp usrc/target/release/unlace unlace-bin/ && cp -r usrc/specs unlace-bin/specs
      - uses: actions/upload-artifact@v4
        with:
          name: bins
          path: |
            target/release/freshbench
            fission-bin
            unlace-bin
  run:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
        tool: ${{ fromJSON(inputs.tools) }}
        build: ${{ fromJSON(inputs.builds) }}
    env:
      FB_BUILDS: ${{ matrix.build != '' && format('--builds={0}', matrix.build) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        if: matrix.tool == 'ghidra'
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/download-artifact@v4
        with: { name: bins, path: "${{ runner.temp }}/bins" }
      - uses: actions/download-artifact@v4
        with: { name: "qual-${{ matrix.project }}-${{ inputs.arch }}", path: "${{ runner.temp }}/qual", run-id: "${{ inputs.qualify_run }}", github-token: "${{ github.token }}" }
      - run: ci/setup_tool.sh ${{ matrix.tool }}
      - name: function boundaries
        if: inputs.track == 'boundaries'
        # --jobs already runs binaries in parallel; one borer call at a time each
        env: { BORER_LIST_JOBS: "1" }
        run: |
          B="$RUNNER_TEMP/bins"; chmod +x "$B/target/release/freshbench" "$B/fission-bin/fission_cli" 2>/dev/null || true
          FB="$B/target/release/freshbench"
          mkdir -p "$RUNNER_TEMP/w" && tar -xf "$RUNNER_TEMP/qual/prep.tar" -C "$RUNNER_TEMP/w"
          R="$RUNNER_TEMP/w/prep"; mkdir -p "$RUNNER_TEMP/up/boundaries"
          case '${{ matrix.tool }}' in ghidra|angr) J=3;; fission|unlace) J=2;; *) J=4;; esac
          for v in as-built no-unwind; do
            o="$RUNNER_TEMP/up/boundaries/${{ matrix.tool }}-$v.jsonl"
            if [ '${{ matrix.tool }}' = fission ]; then
              "$FB" boundaries "$R" $FB_BUILDS --jobs $J --variant $v --out "$o" --tool fission --fission-cli "$B/fission-bin/fission_cli" --resource-root "$B/fission-bin/utils"
            else
              "$FB" boundaries "$R" $FB_BUILDS --jobs $J --variant $v --out "$o" --tool '${{ matrix.tool }}' --adapter $FB_ADAPTER
            fi
          done
          "$FB" boundaries-summary "$RUNNER_TEMP/up/boundaries" > "$RUNNER_TEMP/up/boundaries/summary.json"
      - name: decompile and score
        if: inputs.track != 'boundaries'
        run: |
          B="$RUNNER_TEMP/bins"; chmod +x "$B/target/release/freshbench" "$B/fission-bin/fission_cli" 2>/dev/null || true
          FB="$B/target/release/freshbench"
          mkdir -p "$RUNNER_TEMP/w" && tar -xf "$RUNNER_TEMP/qual/prep.tar" -C "$RUNNER_TEMP/w"
          R="$RUNNER_TEMP/w/prep"
          # binaries at once on a 4-vCPU / 16 GB runner: JVM and angr need several GB each
          case '${{ matrix.tool }}' in ghidra|angr) J=3;; fission|unlace) J=2;; *) J=4;; esac
          if [ '${{ matrix.tool }}' = fission ]; then
            "$FB" decompile "$R" $FB_BUILDS --jobs $J --tool fission --fission-cli "$B/fission-bin/fission_cli" --resource-root "$B/fission-bin/utils"
          else
            "$FB" decompile "$R" $FB_BUILDS --jobs $J --tool '${{ matrix.tool }}' --adapter $FB_ADAPTER
          fi
          "$FB" rescore "$R" $FB_BUILDS --tool '${{ matrix.tool }}' --out "$R/rows/${{ matrix.tool }}.jsonl"
          mkdir -p "$RUNNER_TEMP/up" && cp -r "$R/results" "$R/rows" "$RUNNER_TEMP/up/"
      - name: provenance
        if: always()
        env:
          TOOL: ${{ matrix.tool }}
          FISSION_SHA_USED: ${{ needs.build.outputs.fission_sha }}
          QUALIFY_RUN: ${{ inputs.qualify_run }}
          ARCH: ${{ inputs.arch }}
          PROJECT: ${{ matrix.project }}
          BUILD: ${{ matrix.build }}
          TRACK: ${{ inputs.track }}
        run: |
          mkdir -p "$RUNNER_TEMP/up"
          FB="$RUNNER_TEMP/bins/target/release/freshbench"; chmod +x "$FB"
          "$FB" provenance write --pins ci/pins.env --tool "$TOOL" --fission-sha "$FISSION_SHA_USED" \
            --freshbench-commit "$GITHUB_SHA" --qualify-run "$QUALIFY_RUN" --evaluate-run "$GITHUB_RUN_ID" \
            --arch "$ARCH" --project "$PROJECT" --build "$BUILD" --track "$TRACK" \
            --out "$RUNNER_TEMP/up/provenance.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "${{ inputs.track == 'boundaries' && 'bound' || 'eval' }}-${{ matrix.project }}-${{ inputs.arch }}-${{ matrix.tool }}${{ matrix.build != '' && format('-{0}', matrix.build) || '' }}", path: "${{ runner.temp }}/up", retention-days: 90 }
