name: evaluate
# Decompile prepared builds with one tool and score them with FreshBench's
# own metrics (Rust; no DecBench). Inputs come from a qualify-arch run.
# A run dispatched by sweep.yml carries its sweep id in the run name, so
# sweep.yml can list the runs it started.
run-name: "evaluate ${{ inputs.arch }} ${{ inputs.track }}${{ inputs.sweep != '' && format(' [sweep {0}]', inputs.sweep) || '' }}"
on:
  workflow_dispatch:
    inputs:
      qualify_run: { description: "qualify-arch run id holding qual-<slug>-<arch> artifacts", required: true }
      projects: { description: "JSON list of slugs (owner__repo)", required: true }
      arch: { description: "x86_64 | i686 | aarch64 | armv7", required: true }
      tools: { description: "JSON list", default: '["fission","ghidra","angr","kuna","borer","unlace"]' }
      fission_ref: { description: "git ref of Fission (default: FISSION_SHA in ci/pins.env)", default: "" }
      max_parallel: { description: "concurrent jobs", default: "12" }
      track: { description: "decompile (given function starts) or boundaries (find the functions; as-built and no-unwind)", default: "decompile" }
      builds: { description: 'JSON list of arch-qualified builds, one job each (gcc-O0, armv7-clang-Os); [""] = every build in one job', default: '[""]' }
      sweep: { description: "set by sweep.yml: the sweep this run belongs to", default: "" }
      reuse_runs: { description: "JSON list of earlier evaluate run IDs whose outputs pinned tools may reuse (set by sweep.yml); [] runs every tool", default: "[]" }
permissions: { contents: read, actions: read }
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs: { fission_sha: "${{ steps.ref.outputs.sha }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-release-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --locked -p freshbench
      - id: ref
        env:
          FISSION_REF: ${{ inputs.fission_ref }}
        run: |
          source ci/pins.env
          ref="$FISSION_REF"
          # a branch, tag, ref pattern or commit; never an option or shell-special text
          if [ -n "$ref" ] && ! [[ "$ref" =~ ^[A-Za-z0-9_./+@*][A-Za-z0-9_./+@*-]*$ ]]; then echo "invalid fission_ref: $ref" >&2; exit 1; fi
          if [ -n "$ref" ]; then sha=$(git ls-remote "$FISSION_REPO" "$ref" | head -1 | cut -f1); [ -n "$sha" ] || sha="$ref"; else sha="$FISSION_SHA"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "FISSION_SHA=$sha" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: fc
        with: { path: fission-bin, key: "fission-cli-${{ steps.ref.outputs.sha }}" }
      - if: contains(inputs.tools, 'fission') && steps.fc.outputs.cache-hit != 'true'
        run: |
          source ci/pins.env
          git init -q fsrc && git -C fsrc fetch -q --depth 1 "$FISSION_REPO" "$FISSION_SHA" && git -C fsrc checkout -q FETCH_HEAD
          (cd fsrc && cargo build -p fission-cli --release --locked)
          mkdir -p fission-bin && cp fsrc/target/release/fission_cli fission-bin/ && cp -r fsrc/utils fission-bin/utils
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: uc
        if: contains(inputs.tools, 'unlace')
        with: { path: unlace-bin, key: "unlace-${{ hashFiles('ci/pins.env') }}" }
      - if: contains(inputs.tools, 'unlace') && steps.uc.outputs.cache-hit != 'true'
        run: |
          source ci/pins.env
          git init -q usrc && git -C usrc fetch -q --depth 1 "$UNLACE_REPO" "$UNLACE_SHA" && git -C usrc checkout -q FETCH_HEAD
          (cd usrc && cargo build --release --locked -p unlace-cli)
          mkdir -p unlace-bin && cp usrc/target/release/unlace unlace-bin/ && cp -r usrc/specs unlace-bin/specs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: grc
        if: contains(inputs.tools, 'ghidra-rs')
        with:
          path: ghidra-rs-bin
          key: "ghidra-rs-${{ hashFiles('ci/pins.env', 'adapters/ghidra-rs/Cargo.toml', 'adapters/ghidra-rs/Cargo.lock', 'adapters/ghidra-rs/src/**') }}"
      - if: contains(inputs.tools, 'ghidra-rs') && steps.grc.outputs.cache-hit != 'true'
        run: |
          source ci/pins.env
          # the lock file must carry exactly the pinned crate
          lock=adapters/ghidra-rs/Cargo.lock
          grep -A3 '^name = "ghidra-decompiler"$' "$lock" | grep -qx "version = \"$GHIDRA_RS_VERSION\""
          grep -A3 '^name = "ghidra-decompiler"$' "$lock" | grep -qx "checksum = \"$GHIDRA_RS_CRATE_SHA256\""
          cargo build --release --locked --manifest-path adapters/ghidra-rs/Cargo.toml
          mkdir -p ghidra-rs-bin && cp adapters/ghidra-rs/target/release/freshbench-ghidra-rs ghidra-rs-bin/
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: rc
        if: contains(inputs.tools, 'r2sleigh')
        with: { path: r2sleigh-bin, key: "r2sleigh-${{ hashFiles('ci/pins.env') }}" }
      - if: contains(inputs.tools, 'r2sleigh') && steps.rc.outputs.cache-hit != 'true'
        run: |
          source ci/pins.env
          git init -q rsrc && git -C rsrc fetch -q --depth 1 "$R2SLEIGH_REPO" "$R2SLEIGH_SHA" && git -C rsrc checkout -q FETCH_HEAD
          # the toolchain r2sleigh pins in its rust-toolchain.toml
          (cd rsrc && rustup show active-toolchain || rustup toolchain install)
          (cd rsrc && cargo build --release --locked -p r2s --features sleigh)
          mkdir -p r2sleigh-bin && cp rsrc/target/release/r2s r2sleigh-bin/
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: r2c
        if: contains(inputs.tools, 'r2dec')
        with: { path: r2dec-bin, key: "r2dec-${{ hashFiles('ci/pins.env') }}" }
      - if: contains(inputs.tools, 'r2dec') && steps.r2c.outputs.cache-hit != 'true'
        run: |
          source ci/pins.env
          curl -fsSL -o radare2.deb "$RADARE2_DEB_URL" && echo "$RADARE2_DEB_SHA256  radare2.deb" | sha256sum -c -
          curl -fsSL -o radare2-dev.deb "$RADARE2_DEV_DEB_URL" && echo "$RADARE2_DEV_DEB_SHA256  radare2-dev.deb" | sha256sum -c -
          curl -fsSL -o r2dec-src.zip "$R2DEC_SRC_URL" && echo "$R2DEC_SRC_SHA256  r2dec-src.zip" | sha256sum -c -
          sudo apt-get install -y -q ./radare2.deb ./radare2-dev.deb meson ninja-build pkg-config
          mkdir r2dsrc && unzip -q r2dec-src.zip -d r2dsrc
          # QuickJS is vendored in the zip: no download during the build
          (cd r2dsrc && meson setup build --buildtype=release --wrap-mode=nodownload && ninja -C build)
          mkdir -p r2dec-bin && cp r2dsrc/build/libcore_pdd.so r2dec-bin/
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: mfc
        if: contains(inputs.tools, 'manifold')
        with:
          path: manifold-bin
          key: "manifold-${{ hashFiles('ci/pins.env', 'adapters/manifold/Cargo.lock') }}"
      - if: contains(inputs.tools, 'manifold') && steps.mfc.outputs.cache-hit != 'true'
        run: |
          source ci/pins.env
          echo "$MANIFOLD_LOCK_SHA256  adapters/manifold/Cargo.lock" | sha256sum -c -
          mkdir -p z3 && curl -fsSL -o z3/z3.zip "$MANIFOLD_Z3_URL"
          echo "$MANIFOLD_Z3_SHA256  z3/z3.zip" | sha256sum -c -
          unzip -q z3/z3.zip -d z3 && Z3="$PWD/z3/$MANIFOLD_Z3_DIR"
          # outside the checkout: Manifold's Cargo.toml has no [workspace] of its
          # own, so under the checkout cargo takes FreshBench's root workspace for it
          M="$RUNNER_TEMP/msrc"
          git init -q "$M" && git -C "$M" fetch -q --depth 1 "$MANIFOLD_REPO" "$MANIFOLD_SHA" && git -C "$M" checkout -q FETCH_HEAD
          git -C "$M" submodule update --init --recursive --depth 1
          test "$(git -C "$M" rev-parse HEAD:ascent-plusplus)" = "$MANIFOLD_ASCENT_SHA"
          cp adapters/manifold/Cargo.lock "$M/Cargo.lock"
          rustup toolchain install "$MANIFOLD_RUST" --profile minimal
          # rustc needs ~14 GB for the manifold crate; 2 jobs, no incremental dep graph
          (cd "$M" && Z3_LIBRARY_PATH_OVERRIDE="$Z3/bin" CARGO_INCREMENTAL=0 \
            RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN' \
            cargo "+$MANIFOLD_RUST" build --release --locked -j 2)
          mkdir -p manifold-bin && cp "$M/target/release/manifold" "$Z3/bin/libz3.so" manifold-bin/
          cp "$Z3/LICENSE.txt" manifold-bin/z3-LICENSE.txt
          ldd manifold-bin/manifold | grep -q "libz3.so => $PWD/manifold-bin/libz3.so"
          rm -rf "$M" z3
      # rev.ng's distribution (564 MB) is fetched from rev.ng once per pin, not
      # once per job; run jobs take it from this run's artifact
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: rvc
        if: contains(inputs.tools, 'revng')
        with: { path: revng-dist, key: "revng-${{ hashFiles('ci/pins.env') }}" }
      - if: contains(inputs.tools, 'revng') && steps.rvc.outputs.cache-hit != 'true'
        run: |
          source ci/pins.env
          mkdir -p revng-dist && curl -fsSL -o revng-dist/revng.tar.xz "$REVNG_URL"
          echo "$REVNG_SHA256  revng-dist/revng.tar.xz" | sha256sum -c -
      - if: contains(inputs.tools, 'revng')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: revng-dist, path: revng-dist, compression-level: 0, retention-days: 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bins
          path: |
            target/release/freshbench
            fission-bin
            unlace-bin
            ghidra-rs-bin
            r2sleigh-bin
            r2dec-bin
            manifold-bin
  run:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
        tool: ${{ fromJSON(inputs.tools) }}
        build: ${{ fromJSON(inputs.builds) }}
    env:
      FB_BUILDS: ${{ matrix.build != '' && format('--builds={0}', matrix.build) || '' }}
      # ci/setup_tool.sh rejects any name it does not install
      MATRIX_TOOL: ${{ matrix.tool }}
    steps:
      # The job's hard limit is 350 minutes. Every tool call ends by 290
      # minutes after the job starts and whatever is left is recorded as a
      # timeout, leaving time to score and upload: a cancelled job uploads
      # nothing, so its tool would lose those rows instead of being charged.
      - name: job deadline
        run: echo "FB_DEADLINE=$(( $(date +%s) + 290 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # exact versions (ci/pins.env): a version range takes whatever the runner
      # image carries, which differs between images rolling out at once, so a
      # sweep mixed JVMs and Ghidra outputs were never reused
      - id: pins
        run: |
          source ci/pins.env
          echo "python=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "java=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "${{ steps.pins.outputs.python }}" }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: matrix.tool == 'ghidra'
        with: { distribution: temurin, java-version: "${{ steps.pins.outputs.java }}" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: bins, path: "${{ runner.temp }}/bins" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: "qual-${{ matrix.project }}-${{ inputs.arch }}", path: "${{ runner.temp }}/qual", run-id: "${{ inputs.qualify_run }}", github-token: "${{ github.token }}" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.tool == 'revng'
        with: { name: revng-dist, path: "${{ runner.temp }}/revng-dist" }
      - run: ci/setup_tool.sh "$MATRIX_TOOL"
      # Every tool runs under one cap of the runner's memory (ci/capped.sh):
      # a tool that exceeds it loses its call, not the job its rows. The cap is
      # part of the reuse key.
      - name: memory cap
        run: |
          ci/setup_systemd_user.sh
          # a 16 GB runner, less 2 GB for the system and the runner agent
          echo "FB_MEMORY_MAX=14G" >> "$GITHUB_ENV"
          FB_MEMORY_MAX=14G ci/capped.sh true
          if [ -f "$RUNNER_TEMP/tool-env.txt" ]; then echo "memory cap 14G" >> "$RUNNER_TEMP/tool-env.txt"; fi
      # A pinned tool's output is taken from an earlier run when nothing that
      # can change it did: version, adapter, environment, harness, binary,
      # requests and limits (crates/freshbench/src/reuse.rs). Anything missing
      # means the tool runs. Fission always runs. Every score is computed here.
      - name: reuse context and earlier outputs
        if: matrix.tool != 'fission'
        env:
          GH_TOKEN: "${{ github.token }}"
          REUSE_RUNS: "${{ inputs.reuse_runs }}"
          ARTIFACT: "${{ inputs.track == 'boundaries' && 'bound' || 'eval' }}-${{ matrix.project }}-${{ inputs.arch }}-${{ matrix.tool }}${{ matrix.build != '' && format('-{0}', matrix.build) || '' }}"
        run: |
          FB="$RUNNER_TEMP/bins/target/release/freshbench"; chmod +x "$FB"
          "$FB" reuse-context --pins ci/pins.env --registry ci/tools.json --tool "$MATRIX_TOOL" \
            --adapter-dir "adapters/$MATRIX_TOOL" --adapter-dir adapters/common \
            --env-file "$RUNNER_TEMP/tool-env.txt" --out "$RUNNER_TEMP/reuse-context.json"
          cat "$RUNNER_TEMP/tool-env.txt"; cat "$RUNNER_TEMP/reuse-context.json"
          reuse="--reuse-context $RUNNER_TEMP/reuse-context.json"
          jq -e 'type == "array" and all(.[]; tostring | test("^[0-9]+$"))' <<< "$REUSE_RUNS" >/dev/null
          if [ "$(jq length <<< "$REUSE_RUNS")" -gt 0 ]; then
            # the same job of earlier runs, newest first; two, as the newest may be empty
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT&per_page=100" || echo '{"artifacts":[]}')
            n=0
            for run in $(jq -r --argjson want "$REUSE_RUNS" '[.artifacts[] | select(.expired | not) | .workflow_run.id | select(. as $r | $want | map(tonumber) | index($r))] | .[0:2][]' <<< "$found"); do
              if gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT" -D "$RUNNER_TEMP/reuse/$n"; then
                reuse="$reuse --reuse-from $RUNNER_TEMP/reuse/$n"; n=$((n + 1))
              fi
            done
            echo "$ARTIFACT: $n earlier output(s) offered for reuse"
          fi
          echo "FB_REUSE=$reuse" >> "$GITHUB_ENV"
      - name: function boundaries
        if: inputs.track == 'boundaries'
        # --jobs already runs binaries in parallel; one borer call at a time each
        env: { BORER_LIST_JOBS: "1" }
        run: |
          B="$RUNNER_TEMP/bins"; chmod +x "$B/target/release/freshbench" "$B/fission-bin/fission_cli" 2>/dev/null || true
          FB="$B/target/release/freshbench"
          mkdir -p "$RUNNER_TEMP/w" && tar -xf "$RUNNER_TEMP/qual/prep.tar" -C "$RUNNER_TEMP/w"
          R="$RUNNER_TEMP/w/prep"; mkdir -p "$RUNNER_TEMP/up/boundaries"
          case "$MATRIX_TOOL" in manifold) J=1;; ghidra|angr|revng) J=3;; fission|unlace) J=2;; *) J=4;; esac
          for v in as-built no-unwind; do
            o="$RUNNER_TEMP/up/boundaries/$MATRIX_TOOL-$v.jsonl"
            found=""
            if [ -n "${FB_REUSE:-}" ]; then found="--found-out $RUNNER_TEMP/up/found/$MATRIX_TOOL-$v.jsonl"; fi
            if [ "$MATRIX_TOOL" = fission ]; then
              ci/capped.sh "$FB" boundaries "$R" $FB_BUILDS --jobs $J --deadline "$FB_DEADLINE" --variant $v --out "$o" --tool fission --fission-cli "$B/fission-bin/fission_cli" --resource-root "$B/fission-bin/utils"
            else
              ci/capped.sh "$FB" boundaries "$R" $FB_BUILDS --jobs $J --deadline "$FB_DEADLINE" --variant $v --out "$o" --tool "$MATRIX_TOOL" ${FB_REUSE:-} $found --adapter $FB_ADAPTER
            fi
          done
          "$FB" boundaries-summary "$RUNNER_TEMP/up/boundaries" > "$RUNNER_TEMP/up/boundaries/summary.json"
      - name: decompile and score
        if: inputs.track != 'boundaries'
        run: |
          B="$RUNNER_TEMP/bins"; chmod +x "$B/target/release/freshbench" "$B/fission-bin/fission_cli" 2>/dev/null || true
          FB="$B/target/release/freshbench"
          mkdir -p "$RUNNER_TEMP/w" && tar -xf "$RUNNER_TEMP/qual/prep.tar" -C "$RUNNER_TEMP/w"
          R="$RUNNER_TEMP/w/prep"
          # binaries at once on a 4-vCPU / 16 GB runner: JVM and angr need several GB each
          case "$MATRIX_TOOL" in manifold) J=1;; ghidra|angr|revng) J=3;; fission|unlace) J=2;; *) J=4;; esac
          if [ "$MATRIX_TOOL" = fission ]; then
            ci/capped.sh "$FB" decompile "$R" $FB_BUILDS --jobs $J --deadline "$FB_DEADLINE" --tool fission --fission-cli "$B/fission-bin/fission_cli" --resource-root "$B/fission-bin/utils"
          else
            ci/capped.sh "$FB" decompile "$R" $FB_BUILDS --jobs $J --deadline "$FB_DEADLINE" --tool "$MATRIX_TOOL" ${FB_REUSE:-} --adapter $FB_ADAPTER
          fi
          "$FB" rescore "$R" $FB_BUILDS --tool "$MATRIX_TOOL" --out "$R/rows/$MATRIX_TOOL.jsonl"
          mkdir -p "$RUNNER_TEMP/up" && cp -r "$R/results" "$R/rows" "$RUNNER_TEMP/up/"
      - name: provenance
        if: always()
        env:
          TOOL: ${{ matrix.tool }}
          FISSION_SHA_USED: ${{ needs.build.outputs.fission_sha }}
          QUALIFY_RUN: ${{ inputs.qualify_run }}
          ARCH: ${{ inputs.arch }}
          PROJECT: ${{ matrix.project }}
          BUILD: ${{ matrix.build }}
          TRACK: ${{ inputs.track }}
        run: |
          mkdir -p "$RUNNER_TEMP/up"
          # outputs of a job where the memory cap killed anything are not reused
          if [ -f "$RUNNER_TEMP/oom-kills" ]; then
            cp "$RUNNER_TEMP/oom-kills" "$RUNNER_TEMP/up/oom-kills.txt"
            find "$RUNNER_TEMP/up" \( -name reuse.jsonl -o -path '*/found/*.jsonl' \) -delete
          fi
          FB="$RUNNER_TEMP/bins/target/release/freshbench"; chmod +x "$FB"
          "$FB" provenance write --pins ci/pins.env --registry ci/tools.json --tool "$TOOL" --fission-sha "$FISSION_SHA_USED" \
            --freshbench-commit "$GITHUB_SHA" --qualify-run "$QUALIFY_RUN" --evaluate-run "$GITHUB_RUN_ID" \
            --arch "$ARCH" --project "$PROJECT" --build "$BUILD" --track "$TRACK" \
            --reuse-entries "$RUNNER_TEMP/up" --out "$RUNNER_TEMP/up/provenance.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: "${{ inputs.track == 'boundaries' && 'bound' || 'eval' }}-${{ matrix.project }}-${{ inputs.arch }}-${{ matrix.tool }}${{ matrix.build != '' && format('-{0}', matrix.build) || '' }}", path: "${{ runner.temp }}/up", retention-days: 90 }
  # The last job of a sweep's run asks for collection itself: the hourly
  # schedule of sweep-collect.yml has been seen not to run at all. It runs no
  # decompiler; only it may start workflows.
  sweep-collect:
    needs: run
    if: always() && inputs.sweep != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { actions: write }
    steps:
      - env:
          GH_TOKEN: "${{ github.token }}"
          SWEEP: "${{ inputs.sweep }}"
        run: gh workflow run sweep-collect.yml -R "$GITHUB_REPOSITORY" --ref main -f sweep="$SWEEP" -f finished_run="$GITHUB_RUN_ID"
