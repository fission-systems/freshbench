name: pages
# Landing page: bootstrapped once, when its files change on main.
# Ranking: built from the evaluate runs listed in ci/leaderboard_runs.json (on
# push to main) or given to a manual dispatch. The publication gate
# (ci/leaderboard_gate.py) must pass before anything is deployed; a failing gate
# leaves the published ranking unchanged.
# Needs Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['site-bootstrap/**', 'crates/freshbench/src/report.css', 'crates/freshbench/src/report-theme.js', 'ci/leaderboard_runs.json']
  workflow_dispatch:
    inputs:
      evaluate_runs: { description: "JSON list of completed evaluate run IDs; [] for landing page only", default: "[]" }
      deploy: { description: "Publish to GitHub Pages (false = downloadable preview)", type: boolean, default: false }
permissions: { contents: read, actions: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      runs: ${{ steps.p.outputs.runs }}
      deploy: ${{ steps.p.outputs.deploy }}
      bootstrap: ${{ steps.p.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: p
        env:
          EVENT: "${{ github.event_name }}"
          DISPATCH_RUNS: "${{ inputs.evaluate_runs }}"
          DISPATCH_DEPLOY: "${{ inputs.deploy }}"
          BEFORE: "${{ github.event.before }}"
          SHA: "${{ github.sha }}"
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            runs=$(jq -c . ci/leaderboard_runs.json)
            deploy=true
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then base=HEAD~1; else base=$BEFORE; fi
            if git diff --name-only "$base" "$SHA" -- site-bootstrap crates/freshbench/src/report.css crates/freshbench/src/report-theme.js | grep -q .; then
              bootstrap=true
            else
              bootstrap=false
            fi
          else
            runs="${DISPATCH_RUNS:-[]}"
            deploy="${DISPATCH_DEPLOY:-false}"
            bootstrap=false
          fi
          echo "runs=$runs" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "bootstrap=$bootstrap" >> "$GITHUB_OUTPUT"
  bootstrap:
    needs: plan
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.plan.outputs.bootstrap == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deploy && (inputs.evaluate_runs == '[]' || inputs.evaluate_runs == '')))
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: protect any existing leaderboard
        id: guard
        env:
          GH_TOKEN: "${{ github.token }}"
          BASE_URL: "${{ steps.pages.outputs.base_url }}"
        run: |
          set -euo pipefail
          test -n "$BASE_URL"
          # A previous successful ranking deployment is sufficient reason to
          # skip even if the public CDN is temporarily returning a 404.
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?event=workflow_dispatch&status=success&per_page=100" --jq '.workflow_runs[].id')
          for id in $runs; do
            deployed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '.jobs[] | select(.name == "deploy" and .conclusion == "success") | .id')
            if [ -n "$deployed" ]; then
              echo "Verified ranking deployment exists; refusing to replace it."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          status=$(curl --silent --show-error --location --retry 3 --max-time 30 --output /dev/null --write-out '%{http_code}' "${BASE_URL%/}/summary.json")
          case "$status" in
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            200) echo "Existing summary; refusing to overwrite it."; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Cannot safely determine published state (HTTP $status)" >&2; exit 1 ;;
          esac
      - name: assemble landing page
        if: steps.guard.outputs.publish == 'true'
        run: |
          mkdir -p bootstrap-site
          cp site-bootstrap/index.html bootstrap-site/index.html
          cp crates/freshbench/src/report.css bootstrap-site/theme.css
          cp crates/freshbench/src/report-theme.js bootstrap-site/theme.js
      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.publish == 'true'
        with: { path: bootstrap-site }
      - id: d
        if: steps.guard.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
  build:
    needs: plan
    if: needs.plan.outputs.runs != '[]' && needs.plan.outputs.runs != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-release-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --locked -p freshbench
      - name: collect rows
        env:
          GH_TOKEN: "${{ github.token }}"
          EVALUATE_RUNS: "${{ needs.plan.outputs.runs }}"
        run: |
          mkdir -p site-src/rows
          jq -e 'type == "array" and length > 0 and all(.[]; tostring | test("^[0-9]+$"))' <<< "$EVALUATE_RUNS" >/dev/null
          for id in $(jq -r '.[]' <<< "$EVALUATE_RUNS"); do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'eval-*' -p 'bound-*' -D "dl/$id"
          done
          # every rows/<tool>.jsonl of every artifact, named uniquely
          find dl -path '*/rows/*.jsonl' | sort | while read -r f; do
            cp "$f" "site-src/rows/$(echo "$f" | tr '/' '_')"
          done
          ls site-src/rows | wc -l
      - name: fetch pinned M1 truth (no binaries or source files)
        run: |
          python -m pip install 'huggingface_hub==0.36.0'
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from ci.leaderboard_gate import REVISION
          snapshot_download(repo_id="sjkim1127/freshbench-v2", repo_type="dataset",
                            revision=REVISION, allow_patterns=["m1/truth/*"],
                            local_dir="corpus-data")
          PY
      - name: meta (from the runs' own provenance, not the current pins)
        env:
          EVALUATE_RUNS: "${{ needs.plan.outputs.runs }}"
        run: |
          REVISION=$(python -c 'from ci.leaderboard_gate import REVISION; print(REVISION)')
          target/release/freshbench provenance meta dl --corpus "M1 · dataset $REVISION" \
            --note "evaluate runs: $EVALUATE_RUNS" --out meta.json
          jq '.title = "FreshBench M1 Leaderboard"' meta.json > meta.tmp
          mv meta.tmp meta.json
      - name: validate publication inputs
        run: |
          python ci/leaderboard_gate.py --corpus corpus-data/m1 \
            --manifest corpus/m1/manifest.jsonl.gz --rows site-src/rows \
            --meta meta.json --registry ci/tools.json
      - name: last upstream commit of every registered tool
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          echo '{}' > last.json
          for t in $(jq -r 'keys[]' ci/tools.json); do
            repo=$(jq -r --arg t "$t" '.[$t].repo' ci/tools.json)
            d=$(gh api "repos/$repo/commits?per_page=1" --jq '.[0].commit.committer.date' || echo "")
            [ -n "$d" ] && jq --arg t "$t" --arg d "$d" '.[$t]=$d' last.json > last.tmp && mv last.tmp last.json
          done
          cat last.json
      - name: report, all rows and one function per renamed-clone group
        run: |
          POLICY="--tools ci/tools.json --last-commits last.json --now $(date -u +%F)"
          EXTRA="--corpus corpus-data/m1 --boundaries dl --speed dl $POLICY"
          target/release/freshbench report site-src --out site --meta meta.json $EXTRA
          # DecBench's maintainer asked us to be honest about duplication: every
          # published score also appears with clones removed
          target/release/freshbench report site-src --out site/dedup --meta meta.json $EXTRA \
            --dedup-level renamed --dedup corpus/m1/duplicates-x86_64.json corpus/m1/duplicates-i686.json \
            corpus/m1/duplicates-aarch64.json corpus/m1/duplicates-armv7.json
          # Policy filtering must not leave an empty or single-tool ranking.
          jq -e '.summary.rows == 285875 and (.summary.tools | length) >= 2 and (.summary.distance | length) >= 2' site/summary.json >/dev/null
          jq -e '(.summary.tools | length) >= 2 and (.summary.distance | length) >= 2' site/dedup/summary.json >/dev/null
          # Link both populations without depending on an absolute site URL.
          python - <<'PY'
          from pathlib import Path
          for filename, nav in [
              ("site/index.html", '<nav><b>All M1 rows</b> · <a href="dedup/index.html">Renamed-clone-deduplicated</a> · <a href="summary.json">JSON</a> · <a href="speed.md">Speed</a></nav>'),
              ("site/dedup/index.html", '<nav><a href="../index.html">All M1 rows</a> · <b>Renamed-clone-deduplicated</b> · <a href="summary.json">JSON</a></nav>'),
          ]:
              p = Path(filename)
              p.write_text(p.read_text().replace("<!-- publication-nav -->", nav.replace("<nav>", '<nav class="section-nav" aria-label="Population">'), 1))
          PY
          # what each tool cost: CPU and wall time and memory per binary and per function
          target/release/freshbench speed dl > site/speed.md
          target/release/freshbench speed dl --json > site/speed.json
      - uses: actions/upload-artifact@v4
        with: { name: leaderboard-preview, path: site, if-no-files-found: error }
      - uses: actions/upload-pages-artifact@v3
        if: needs.plan.outputs.deploy == 'true'
        with: { path: site }
  deploy:
    if: needs.plan.outputs.deploy == 'true' && github.ref == 'refs/heads/main'
    needs: [plan, build]
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
