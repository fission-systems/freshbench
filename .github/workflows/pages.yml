name: pages
# Results site from evaluate runs. Manual only: a public page is published only
# when someone runs this. Needs Settings -> Pages -> Source: GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      evaluate_runs: { description: "JSON list of evaluate run ids whose eval-* artifacts to publish", required: true }
      corpus: { description: "corpus line shown on the page (milestone, dataset revision)", required: true }
permissions: { contents: read, actions: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-release-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --locked -p freshbench
      - name: collect rows
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p site-src/rows
          for id in $(echo '${{ inputs.evaluate_runs }}' | python3 -c 'import json,sys;print(" ".join(map(str,json.load(sys.stdin))))'); do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'eval-*' -D "dl/$id"
          done
          # every rows/<tool>.jsonl of every artifact, named uniquely
          find dl -path '*/rows/*.jsonl' | sort | while read -r f; do
            cp "$f" "site-src/rows/$(echo "$f" | tr '/' '_')"
          done
          ls site-src/rows | wc -l
      - name: meta (from the runs' own provenance, not the current pins)
        run: |
          python3 - <<'PY'
          import glob, json, collections
          prov = [json.load(open(f)) for f in sorted(glob.glob("dl/*/*/provenance.json"))]
          assert prov, "no provenance.json in the artifacts"
          by_tool = collections.defaultdict(set)
          for p in prov:
              by_tool[p["tool"]].add(p["tool_version"])
          mixed = {t: sorted(v) for t, v in by_tool.items() if len(v) > 1}
          assert not mixed, f"one tool measured at several versions: {mixed}"
          qual = {p["qualify_run"] for p in prov}
          assert len(qual) == 1, f"artifacts from several corpus builds: {sorted(qual)}"
          pins = {t: next(iter(v)) for t, v in sorted(by_tool.items())}
          pins["corpus build (qualify-arch run)"] = qual.pop()
          pins["freshbench commits"] = ", ".join(sorted({p["freshbench_commit"][:12] for p in prov}))
          json.dump({"title": "FreshBench results", "corpus": "${{ inputs.corpus }}", "pins": pins,
                     "notes": ["evaluate runs: ${{ inputs.evaluate_runs }}",
                               f"{len(prov)} result artifacts; rows from different scorers or duplicated rows with different content are refused by the report"]},
                    open("meta.json", "w"), indent=1)
          PY
      - name: report, all rows and one function per renamed-clone group
        run: |
          target/release/freshbench report site-src --out site --meta meta.json
          # DecBench's maintainer asked us to be honest about duplication: every
          # published score also appears with clones removed
          target/release/freshbench report site-src --out site/dedup --meta meta.json \
            --dedup corpus/m1/duplicates-x86_64.json --dedup-level renamed
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
